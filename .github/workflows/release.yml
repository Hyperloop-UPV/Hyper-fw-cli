name: Release

on:
  workflow_run:
    workflows: ["Build binaries"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Optional: run ID of a Build binaries workflow to release from"
        required: false
        default: ""

# Required so we can create the release and push the tag.
permissions:
  contents: write
  actions: read   # needed to download artifacts from the triggering run

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    # Only run when the triggering build succeeded. Manual dispatch bypasses this.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository (release ref)
        uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, checkout the ref the build ran on,
          # NOT the default branch. Falls back to the current ref for manual runs.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0   # full history for git log in the notes step

      # Pull all artifacts from the build run into ./artifacts/<name>/
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
        run: |
          mkdir -p artifacts
          for attempt in 1 2 3 4 5; do
            if gh run download "$RUN_ID" -D artifacts; then
              echo "Download succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "::error::Failed to download artifacts after 5 attempts"
          exit 1

      - name: Flatten artifacts into ./release_files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;
          echo "----- release_files -----"
          ls -la release_files

      - name: Read version from hyper cli binary
        id: version
        run: |
          chmod +x release_files/hyper-linux-x64
          RAW=$(./release_files/hyper-linux-x64 version -quiet)
          echo "Raw output: $RAW"

          # Expected format: "args[0] v0.2.4"
          VERSION=$(printf '%s\n' "$RAW" \
            | sed -nE 's/^.*[[:space:]](v[0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' \
            | head -n1)

          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from 'hyper version' output: $RAW"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $VERSION"

      - name: Compute commit range and write commit log
        id: range
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Most recent version tag reachable from HEAD, excluding the tag we're about to create.
          PREV_TAG=$(git describe --tags --abbrev=0 \
                    --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || true)

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" = "$CURRENT_VERSION" ]; then
            # Retry of an existing release: look one tag further back.
            PREV_TAG=$(git describe --tags --abbrev=0 \
                      --match 'v[0-9]*.[0-9]*.[0-9]*' "${PREV_TAG}^" 2>/dev/null || true)
          fi

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            echo "base=$PREV_TAG" >> "$GITHUB_OUTPUT"
          else
            RANGE="HEAD"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi
          echo "Using commit range: $RANGE"

          git log "$RANGE" -n 250 --pretty=format:'- %s (`%h`)' > /tmp/commits.md

          {
            echo "## Changelog"
            echo
            cat /tmp/commits.md
          } > release_notes.md

      - name: Append contributors for this release
        uses: actions/github-script@v7
        env:
          BASE_TAG: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const base = process.env.BASE_TAG;         // e.g. "v0.2.3" or ""
            const head = process.env.HEAD_SHA;         // full SHA

            // 1) Resolve BASE_TAG (if any) to a commit SHA.
            //    If no previous tag, we'll walk all commits reachable from head.
            let baseSha = null;
            if (base) {
              try {
                const ref = await github.rest.git.getRef({
                  owner, repo, ref: `tags/${base}`,
                });
                baseSha = ref.data.object.sha;

                // Handle annotated tags: the ref points at a tag object,
                // not directly at the commit.
                if (ref.data.object.type === 'tag') {
                  const tagObj = await github.rest.git.getTag({
                    owner, repo, tag_sha: baseSha,
                  });
                  baseSha = tagObj.data.object.sha;
                }
                core.info(`Base tag ${base} resolves to ${baseSha}`);
              } catch (err) {
                core.warning(`Could not resolve tag ${base}: ${err.message}`);
                baseSha = null;
              }
            }

            // 2) Walk commits from HEAD back to base (exclusive).
            //    Stop as soon as we hit baseSha.
            const authors = new Map(); // key -> { login, name, email }
            let page = 1;
            const perPage = 100;
            let done = false;

            while (!done) {
              const res = await github.rest.repos.listCommits({
                owner, repo, sha: head, per_page: perPage, page,
              });
              if (res.data.length === 0) break;

              for (const c of res.data) {
                if (baseSha && c.sha === baseSha) { done = true; break; }

                // Prefer the resolved GitHub login; fall back to name+email
                // for commits whose author isn't linked to a GitHub account.
                const login = c.author?.login;
                const name  = c.commit?.author?.name  ?? 'Unknown';
                const email = c.commit?.author?.email ?? '';

                const key = login ? `login:${login}` : `email:${email}`;

                if (!authors.has(key)) {
                  authors.set(key, { login, name, email });
                }
              }
              page++;
            }

            // 3) Filter out bots and format the section.
            const botRegex = /(\[bot\]$|-bot$|^dependabot$|^renovate$|^github-actions$)/i;
            const humans = [...authors.values()]
              .filter(a => !(a.login && botRegex.test(a.login)))
              .sort((a, b) => {
                const an = (a.login || a.name).toLowerCase();
                const bn = (b.login || b.name).toLowerCase();
                return an.localeCompare(bn);
              });

            if (humans.length === 0) {
              core.info('No contributors found for this release range.');
              return;
            }

            const lines = humans.map(a => {
              if (a.login) return `- @${a.login}`;
              // Unlinked contributor: show name, and email in parens if present
              return a.email ? `- ${a.name} <${a.email}>` : `- ${a.name}`;
            });

            fs.appendFileSync(
              'release_notes.md',
              ['', '', '## Contributors', '', ...lines, ''].join('\n'),
            );
            core.info(`Added ${humans.length} contributors for this release.`);

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: release_files/*
          generate_release_notes: false
          draft: false
          prerelease: false
