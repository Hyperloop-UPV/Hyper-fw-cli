name: Build binaries

on:
  workflow_dispatch:   # manual trigger only

jobs:
  build-linux-x64:
    name: Build Linux x64 (glibc 2.31)
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
    steps:
      # Bullseye reached EOL on 2026-08-31. The bullseye-security pool files
      # have been withdrawn from deb.debian.org while the index still lists
      # them, causing the 404s. Pin to an immutable snapshot taken just
      # before EOL so the index and pool files are always consistent.
      - name: Pin apt to snapshot.debian.org (Bullseye EOL workaround)
        run: |
          cat > /etc/apt/sources.list <<'EOF'
          deb http://snapshot.debian.org/archive/debian/20260824T000000Z bullseye main
          deb http://snapshot.debian.org/archive/debian-security/20260824T000000Z bullseye-security main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99snapshot
          echo 'Acquire::Retries "5";'            > /etc/apt/apt.conf.d/99retries

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends --fix-missing \
            ca-certificates \
            curl \
            git \
            build-essential \
            gnupg

          # Modern keyring approach (apt-key is deprecated)
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/bullseye/ llvm-toolchain-bullseye-14 main" \
            > /etc/apt/sources.list.d/llvm.list

          apt-get update
          apt-get install -y --no-install-recommends --fix-missing \
            llvm-14-dev \
            clang-14 \
            lld-14

          ln -sf /usr/bin/llvm-config-14 /usr/local/bin/llvm-config
          ln -sf /usr/bin/clang-14       /usr/local/bin/clang

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Odin compiler
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Linux x64
        run: |
          odin build . -out:hyper-linux-x64 -o:speed -target:linux_amd64
        env:
          LLVM_CONFIG: /usr/local/bin/llvm-config

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyper-linux-x64
          path: hyper-linux-x64

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
    steps:
      - name: Enable arm64 architecture
        run: dpkg --add-architecture arm64

      # Same Bullseye EOL workaround as the x64 job. Do NOT list per-arch
      # duplicates of the same repo — a single deb line pulls Packages
      # indexes for all enabled architectures, and duplicating them causes
      # apt warnings and can desync libc6 from libc6-dev.
      - name: Pin apt to snapshot.debian.org (Bullseye EOL workaround)
        run: |
          cat > /etc/apt/sources.list <<'EOF'
          deb http://snapshot.debian.org/archive/debian/20260824T000000Z bullseye main
          deb http://snapshot.debian.org/archive/debian-security/20260824T000000Z bullseye-security main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99snapshot
          echo 'Acquire::Retries "5";'            > /etc/apt/apt.conf.d/99retries

      - name: Install system dependencies and cross-compilation toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends --fix-missing \
            ca-certificates \
            curl \
            git \
            build-essential \
            gnupg \
            crossbuild-essential-arm64 \
            libc6-dev-arm64-cross

          # Add LLVM repo (modern keyring approach)
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/bullseye/ llvm-toolchain-bullseye-14 main" \
            > /etc/apt/sources.list.d/llvm.list

          apt-get update
          apt-get install -y --no-install-recommends --fix-missing \
            clang-14 \
            lld-14 \
            llvm-14-dev

          ln -sf /usr/bin/llvm-config-14 /usr/local/bin/llvm-config
          ln -sf /usr/bin/clang-14       /usr/local/bin/clang
          ln -sf /usr/bin/ld.lld-14      /usr/local/bin/ld.lld

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Odin compiler
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Linux ARM64
        run: |
          odin build . -out:hyper-linux-arm64 -o:speed -target:linux_arm64 \
            -extra-linker-flags:"--target=aarch64-linux-gnu -fuse-ld=lld"
        env:
          LLVM_CONFIG: /usr/local/bin/llvm-config
          CC: clang-14
          CXX: clang++-14
          AR: llvm-ar-14
          LD: ld.lld
          CFLAGS: "--target=aarch64-linux-gnu -fuse-ld=lld"
          LDFLAGS: "--target=aarch64-linux-gnu -fuse-ld=lld"
          LIBRARY_PATH: "/usr/aarch64-linux-gnu/lib"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyper-linux-arm64
          path: hyper-linux-arm64

